<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Studio | Premium Design Agency</title>

<style>
  :root {
      --bg: #050505;
      --surface: #111111;
      --primary: #BB86FC;
      --secondary: #007BFF;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border: #222222;
      --gradient: linear-gradient(135deg, var(--secondary), var(--primary));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); overflow-x: hidden; scroll-behavior: smooth; }
  
  /* شريط التنقل (Navbar) مثل المواقع الكبرى */
  nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 5%; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
      position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; color: transparent; text-decoration: none; letter-spacing: 1px;}
  .nav-links { display: flex; gap: 20px; }
  .nav-links a { color: var(--text); text-decoration: none; font-size: 0.95rem; transition: 0.3s; }
  .nav-links a:hover { color: var(--primary); }
  .btn-nav { padding: 10px 20px; background: var(--gradient); color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

  /* قسم البداية (Hero) */
  .hero { padding: 160px 5% 100px; text-align: center; background: radial-gradient(circle at top, #1a1a2e 0%, var(--bg) 70%); }
  .badge { display: inline-block; padding: 8px 16px; background: rgba(187,134,252,0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-bottom: 25px; }
  .hero h1 { font-size: 3.8rem; line-height: 1.1; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; }
  .hero h1 span { background: var(--gradient); -webkit-background-clip: text; color: transparent; }
  .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; font-size: 1.1rem; }
  .hero-btns { display: flex; justify-content: center; gap: 15px; }
  .btn-main { padding: 15px 35px; background: var(--gradient); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; transition: 0.3s; }
  .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(187,134,252,0.3); }
  .btn-outline { padding: 15px 35px; border: 1px solid var(--border); color: var(--text); text-decoration: none; border-radius: 6px; font-weight: 600; transition: 0.3s; background: var(--surface); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  /* شريط الثقة والإحصائيات */
  .stats { display: flex; justify-content: center; gap: 60px; padding: 40px 5%; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap;}
  .stat { text-align: center; }
  .stat h3 { font-size: 2.2rem; color: var(--primary); font-weight: 800; }
  .stat p { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}

  /* الأقسام العامة */
  .section { padding: 100px 5%; }
  .section-header { text-align: center; margin-bottom: 60px; }
  .section-header h2 { font-size: 2.5rem; margin-bottom: 15px; text-transform: uppercase; }
  .section-header p { color: var(--text-muted); max-width: 500px; margin: 0 auto; font-size: 1.05rem; }

  /* جداول الأسعار والخدمات (مثل موقع CV Pro بالضبط) */
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
  .pricing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; transition: 0.3s; position: relative; }
  .pricing-card:hover { border-color: var(--primary); transform: translateY(-10px); }
  .popular-badge { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: var(--gradient); padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 800; color: #fff;}
  .pricing-card h3 { font-size: 1.6rem; margin-bottom: 10px; }
  .price { font-size: 3rem; font-weight: 800; margin-bottom: 25px; color: #fff; }
  .price span { font-size: 1.2rem; color: #555; font-weight: 600; text-decoration: line-through; margin-left: 10px;}
  
  /* علامات الصح الخضراء للمميزات */
  .features-list { list-style: none; margin-bottom: 35px; }
  .features-list li { margin-bottom: 15px; color: var(--text-muted); font-size: 1rem; display: flex; align-items: center; gap: 12px;}
  .features-list li::before { content: '✓'; color: #00e676; font-weight: 800; font-size: 1.2rem; }
  .btn-block { display: block; text-align: center; width: 100%; }

  /* معرض الأعمال (Portfolio Grid) */
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto;}
  .portfolio-item { background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; }
  .portfolio-item:hover { border-color: var(--primary); transform: scale(1.02); }
